<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melbourne Transport Map</title>
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v3.9.2/mapbox-gl.css"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
      #map { width: 100%; height: 100%; }

      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }
      #status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      #reconnect-btn {
        display: none;
        background: #5cb85c; color: #fff; border: none;
        border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
      }

      /* ── Vehicle info panel ── */
      #panel {
        display: none;
        position: absolute;
        top: 0;
        right: 0;
        width: 340px;
        height: 100%;
        background: rgba(10, 10, 14, 0.92);
        color: #e0e0e0;
        z-index: 3;
        overflow-y: auto;
        border-left: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(12px);
      }
      #panel.open { display: block; }
      #panel-close {
        position: absolute;
        top: 10px;
        right: 12px;
        background: none;
        border: none;
        color: #888;
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
      }
      #panel-close:hover { color: #fff; }
      #panel-content { padding: 20px; }
      #panel-content h2 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 16px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .panel-mode-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 14px;
      }
      .panel-field { margin-bottom: 12px; }
      .panel-field-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #777;
        margin-bottom: 2px;
      }
      .panel-field-value {
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .panel-divider {
        border: none;
        border-top: 1px solid rgba(255,255,255,0.08);
        margin: 16px 0;
      }
      .panel-alert {
        background: rgba(255, 170, 0, 0.1);
        border-left: 3px solid #f0ad4e;
        padding: 8px 10px;
        margin-bottom: 8px;
        font-size: 12px;
        line-height: 1.4;
        border-radius: 0 4px 4px 0;
      }
      .panel-alert-header { font-weight: 600; margin-bottom: 3px; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="status">
      <span id="status-dot"></span>
      <span id="status-label">Loading…</span>
      <span id="status-info" style="color: #aaa"></span>
      <button id="reconnect-btn">Reconnect</button>
    </div>

    <div id="panel">
      <button id="panel-close">✕</button>
      <div id="panel-content"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
