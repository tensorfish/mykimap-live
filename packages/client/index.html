<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Melbourne Transport Map</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.2/mapbox-gl.css" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
      #map { width: 100%; height: 100%; }

      /* ── Status bar ── */
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: auto;
        backdrop-filter: blur(8px);
      }
      #status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      #reconnect-btn {
        display: none;
        background: #5cb85c; color: #fff; border: none;
        border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
      }

      /* ── Filter bar ── */
      #filters {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        pointer-events: auto;
        backdrop-filter: blur(8px);
      }
      .filter-chip {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
        border: 1px solid rgba(255,255,255,0.15);
        transition: opacity 0.15s;
      }
      .filter-chip.off { opacity: 0.35; }
      .filter-chip .dot {
        width: 8px; height: 8px; border-radius: 50%;
      }
      #filter-expand {
        background: none;
        border: 1px solid rgba(255,255,255,0.15);
        color: #888;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 10px;
        transition: all 0.15s;
        flex-shrink: 0;
        margin-left: 2px;
      }
      #filter-expand:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
      #filter-expand.open { transform: rotate(180deg); }
      #filter-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
        /* Take full width of the flex line (chips row) without expanding the container */
        flex-basis: 100%;
      }
      #filter-row input {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        color: #fff;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        outline: none;
      }
      #filter-row input:focus { border-color: rgba(255,255,255,0.35); }
      #filter-row input::placeholder { color: #555; }
      #filter-count { font-size: 11px; color: #666; align-self: flex-end; }
      .chip-count {
        opacity: 0.5;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }


      /* ── Vehicle info panel (floating card) ── */
      #panel {
        display: none;
        position: absolute;
        top: 56px; right: 12px; bottom: 12px;
        width: 320px;
        background: rgba(10, 10, 14, 0.92);
        color: #e0e0e0;
        z-index: 3;
        overflow-y: auto;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }
      #panel.open { display: block; }
      #panel-close {
        position: absolute; top: 10px; right: 12px;
        background: none; border: none; color: #888;
        font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1;
      }
      #panel-close:hover { color: #fff; }
      #panel-content { padding: 20px; }
      #panel-content h2 {
        font-size: 15px; font-weight: 600; margin: 0 0 16px;
        text-transform: uppercase; letter-spacing: 0.5px;
      }
      .panel-mode-badge {
        display: inline-block; padding: 2px 10px; border-radius: 3px;
        font-size: 11px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.5px; margin-bottom: 14px;
      }
      .panel-field { margin-bottom: 12px; }
      .panel-field-label {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
        color: #777; margin-bottom: 2px;
      }
      .panel-field-value { font-size: 14px; font-variant-numeric: tabular-nums; }
      .panel-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0; }
      .panel-alert {
        background: rgba(255, 170, 0, 0.1); border-left: 3px solid #f0ad4e;
        padding: 8px 10px; margin-bottom: 8px; font-size: 12px; line-height: 1.4;
        border-radius: 0 4px 4px 0;
      }
      .panel-alert-header { font-weight: 600; margin-bottom: 3px; }
      .panel-subtle { opacity: 0.45; }
      .panel-subtle-row {
        display: flex; justify-content: space-between; font-size: 11px; line-height: 1.8;
      }
      .panel-subtle-label { color: #888; }
      .panel-subtle-value {
        color: #aaa; font-variant-numeric: tabular-nums; text-align: right;
        max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }

      /* ── Playback controls ── */
      #playback {
        position: absolute;
        bottom: 12px; left: 12px; right: 12px;
        z-index: 2;
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        backdrop-filter: blur(8px);
        pointer-events: auto;
      }
      #pb-slider { flex: 1; cursor: pointer; }
      #pb-close, #pb-play, #pb-back, #pb-fwd {
        background: none; border: 1px solid rgba(255,255,255,0.2);
        color: #fff; border-radius: 4px; padding: 4px 10px;
        cursor: pointer; font-size: 12px;
      }
      #pb-close:hover, #pb-play:hover { background: rgba(255,255,255,0.1); }
      #pb-date, #pb-speed {
        background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
        color: #fff; border-radius: 4px; padding: 3px 6px; font-size: 12px;
        color-scheme: dark;
      }
      #pb-time { font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }
      #history-btn {
        background: rgba(255,255,255,0.08);
        color: #aaa;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 4px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 12px;
        margin-left: 4px;
        transition: all 0.15s;
      }
      #history-btn:hover { color: #fff; background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.35); }

      /* ── Error modal ── */
      #error-overlay {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 20;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
      }
      #error-overlay.visible { display: flex; }
      #error-modal {
        background: rgba(20, 10, 10, 0.95);
        border: 1px solid rgba(220, 50, 50, 0.3);
        border-radius: 12px;
        padding: 24px 32px;
        color: #e0e0e0;
        max-width: 520px;
        width: 90%;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        backdrop-filter: blur(16px);
      }
      #error-title {
        font-size: 16px;
        font-weight: 600;
        color: #f44;
        margin-bottom: 10px;
      }
      #error-message {
        font-size: 13px;
        color: #ccc;
        margin-bottom: 12px;
        line-height: 1.5;
      }
      #error-details {
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 11px;
        color: #999;
        max-height: 150px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        margin-bottom: 14px;
        font-family: monospace;
      }
      #error-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      #error-copy, #error-dismiss {
        background: none;
        border: 1px solid rgba(255,255,255,0.15);
        color: #aaa;
        border-radius: 4px;
        padding: 5px 14px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.15s;
      }
      #error-copy:hover, #error-dismiss:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

      /* ── Loading modal ── */
      #loading-overlay {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
      }
      #loading-overlay.visible { display: flex; }
      #loading-modal {
        background: rgba(15, 15, 20, 0.95);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 28px 36px;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        min-width: 240px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        backdrop-filter: blur(16px);
      }
      #loading-spinner {
        width: 28px; height: 28px;
        border: 2px solid rgba(255,255,255,0.12);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading-text { color: #aaa; font-size: 13px; }
      #loading-cancel {
        background: none;
        border: 1px solid rgba(255,255,255,0.15);
        color: #888;
        border-radius: 4px;
        padding: 4px 16px;
        cursor: pointer;
        font-size: 12px;
        margin-top: 4px;
        transition: all 0.15s;
      }
      #loading-cancel:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

      /* ── Mobile ── */
      @media (max-width: 640px) {
        #status { top: auto; bottom: 12px; left: 8px; right: 8px; font-size: 12px; padding: 6px 10px; }
        #filters { top: 8px; left: 8px; right: 8px; font-size: 11px; padding: 6px 8px; gap: 4px; }
        .filter-chip { padding: 3px 7px; font-size: 11px; }
        #panel {
          top: auto; bottom: 0; left: 0; right: 0;
          width: 100%; height: 60%;
          border-radius: 16px 16px 0 0;
          border: none; border-top: 1px solid rgba(255,255,255,0.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="status">
      <span id="status-dot"></span>
      <span id="status-label">Loading…</span>
      <span id="status-info" style="color: #aaa"></span>
      <button id="reconnect-btn">Reconnect</button>
      <button id="history-btn">History</button>
    </div>

    <div id="filters">
      <div class="filter-chip" data-filter="metro"><span class="dot" style="background:#34ACE1"></span>Trains <span class="chip-count">—</span></div>
      <div class="filter-chip" data-filter="tram"><span class="dot" style="background:#78BE20"></span>Trams <span class="chip-count">—</span></div>
      <div class="filter-chip" data-filter="bus"><span class="dot" style="background:#FF8200"></span>Buses <span class="chip-count">—</span></div>
      <div class="filter-chip" data-filter="vline"><span class="dot" style="background:#A57FB2"></span>V/Line <span class="chip-count">—</span></div>
      <button id="filter-expand" title="Filter by route or vehicle">▼</button>
      <div id="filter-row" style="display:none">
        <input id="filter-route" type="text" placeholder="Route" spellcheck="false" />
        <input id="filter-vehicle" type="text" placeholder="Vehicle ID" spellcheck="false" />
        <span id="filter-count"></span>
      </div>
    </div>

    <!-- Error modal -->
    <div id="error-overlay">
      <div id="error-modal">
        <div id="error-title">Something went wrong</div>
        <div id="error-message"></div>
        <pre id="error-details"></pre>
        <div id="error-actions">
          <button id="error-copy">Copy error details</button>
          <button id="error-dismiss">Dismiss</button>
        </div>
      </div>
    </div>

    <div id="loading-overlay">
      <div id="loading-modal">
        <div id="loading-spinner"></div>
        <div id="loading-text">Loading...</div>
        <button id="loading-cancel">Cancel</button>
      </div>
    </div>

    <div id="panel">
      <button id="panel-close">✕</button>
      <div id="panel-content"></div>
    </div>

    <!-- Playback controls -->
    <div id="playback" style="display:none">
      <button id="pb-close" title="Back to live">Live</button>
      <input id="pb-date" type="date" />
      <button id="pb-back" title="Back 15s">-15s</button>
      <button id="pb-play">▶</button>
      <button id="pb-fwd" title="Forward 15s">+15s</button>
      <input id="pb-slider" type="range" min="0" max="100" value="0" />
      <span id="pb-time">--:--</span>
      <select id="pb-speed">
        <option value="1">1×</option>
        <option value="10">10×</option>
        <option value="60" selected>60×</option>
        <option value="360">360×</option>
      </select>
    </div>



    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
